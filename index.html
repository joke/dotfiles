#!/bin/sh
set -eu

export PATH="$HOME/.local/bin:$PATH"
command -v mise >/dev/null 2>&1 || curl -fsSL https://mise.run | sh

mise bootstrap \
  --from git@github.com:joke/dotfiles.git \
  --from-dir "$HOME/Projects/joke/dotfiles" \
  --config-dir .config/mise \
  --update \
  --force-dotfiles \
  --yes
