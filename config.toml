[settings]
experimental = true
not_found_auto_install = true
disable_default_registry = true
trusted_config_paths = [
  '~/Projects/joke'
]
disable_backends = [
  "asdf"
]

[tools]
"github:jdx/mise" = "2026.11.8"
"github:zimfw/zimfw" = { version = "1.18.0", asset_pattern = "zimfw.zsh", bin = "zimfw" }
"github:starship/starship" = "1.23.0"

[dotfiles]
"~" = { source = "dotfiles", mode = "symlink-each", manifest = "git" }
